<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide-out Top Bar — Atlas Example</title>
    <style>
        /* ─── Base ────────────────────────────────────── */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            line-height: 1.6;
            padding: 0;
            padding-top: 60px; /* Space for fixed top bar */
        }

        /* ─── Page Header (below top bar) ────────────── */

        .page-header {
            max-width: 1200px;
            margin: 0 auto 2rem auto;
            padding: 1rem 1.5rem 1rem 1.5rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .page-header p {
            color: #475569;
        }

        .page-header .nav-links {
            margin-top: 0.5rem;
        }

        .page-header .nav-links a {
            color: #2563eb;
            text-decoration: none;
            margin-right: 1.5rem;
            font-size: 0.9rem;
        }

        .page-header .nav-links a:hover {
            text-decoration: underline;
        }

        /* ─── Fixed Top Bar ───────────────────────────── */

        .topbar-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: #1e293b;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .topbar-inner-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .topbar-toggle {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 0;
            background: transparent;
            color: white;
            cursor: pointer;
            user-select: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: background 0.2s;
            border: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }

        .topbar-toggle:hover {
            color: #94a3b8;
        }

        .topbar-toggle .arrow {
            transition: transform 0.3s ease;
            display: inline-block;
            font-size: 0.7rem;
            margin-left: auto;
        }

        .topbar-toggle .arrow.open {
            transform: rotate(180deg);
        }

        .topbar-toggle .badge {
            background: #22d3ee;
            color: #0f172a;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 0.1rem 0.5rem;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .topbar-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.3s ease;
            padding: 0;
            background: #1e293b;
            border-top: 1px solid #334155;
        }

        .topbar-content.open {
            max-height: 800px;
            padding: 1rem 0 1.5rem 0;
        }

        .topbar-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1.5rem;
            align-items: start;
        }

        /* ─── Controls in Top Bar ────────────────────── */

        .topbar-grid [data-filters] {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding: 0;
            background: transparent;
            border: none;
            margin: 0;
        }

        .topbar-grid [data-filter] {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .topbar-grid [data-filter] label {
            font-weight: 600;
            font-size: 0.65rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .topbar-grid [data-filter-options] {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
        }

        .topbar-grid [data-filter-options] button {
            padding: 0.15rem 0.6rem;
            border: 1px solid #334155;
            border-radius: 14px;
            background: #0f172a;
            cursor: pointer;
            font-size: 0.75rem;
            font-family: inherit;
            color: #94a3b8;
            transition: all 0.15s;
        }

        .topbar-grid [data-filter-options] button:hover {
            background: #334155;
            color: #e2e8f0;
        }

        .topbar-grid [data-filter-options] button.active {
            background: #22d3ee;
            color: #0f172a;
            border-color: #22d3ee;
        }

        .topbar-grid [data-sort] {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            padding: 0;
            align-items: center;
        }

        .topbar-grid [data-sort] button {
            padding: 0.2rem 0.7rem;
            border: 1px solid #334155;
            border-radius: 4px;
            background: #0f172a;
            cursor: pointer;
            font-size: 0.75rem;
            font-family: inherit;
            color: #94a3b8;
            transition: all 0.15s;
        }

        .topbar-grid [data-sort] button:hover {
            background: #334155;
            color: #e2e8f0;
        }

        .topbar-grid [data-sort] button.active {
            background: #22d3ee;
            color: #0f172a;
            border-color: #22d3ee;
        }

        .topbar-grid [data-sort] button.asc {
            background: #10b981;
            color: #0f172a;
            border-color: #10b981;
        }

        .topbar-grid [data-sort] button.desc {
            background: #ef4444;
            color: #0f172a;
            border-color: #ef4444;
        }

        .topbar-grid [data-search] {
            padding: 0.4rem 0.7rem;
            font-size: 0.85rem;
            border: 1px solid #334155;
            border-radius: 6px;
            width: 100%;
            font-family: inherit;
            background: #0f172a;
            color: #e2e8f0;
            transition: border-color 0.2s;
        }

        .topbar-grid [data-search]::placeholder {
            color: #64748b;
        }

        .topbar-grid [data-search]:focus {
            outline: none;
            border-color: #22d3ee;
        }

        .topbar-grid [data-chips] {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.3rem;
            padding: 0.3rem 0;
            min-height: 2rem;
        }

        .topbar-grid .atlas-chips-empty {
            color: #64748b;
            font-style: italic;
            font-size: 0.75rem;
        }

        .topbar-grid .atlas-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
            background: #334155;
            border-radius: 14px;
            padding: 0.1rem 0.3rem 0.1rem 0.6rem;
            font-size: 0.7rem;
            border: 1px solid #475569;
            color: #e2e8f0;
        }

        .topbar-grid .atlas-chip-remove {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            color: #94a3b8;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .topbar-grid .atlas-chip-remove:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.2);
        }

        .topbar-grid .atlas-clear-all {
            background: none;
            border: 1px solid #ef4444;
            color: #ef4444;
            border-radius: 14px;
            padding: 0.1rem 0.6rem;
            font-size: 0.65rem;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }

        .topbar-grid .atlas-clear-all:hover {
            background: #ef4444;
            color: #0f172a;
        }

        .topbar-grid [data-layout] {
            padding: 0.2rem 0.6rem;
            border: 1px solid #334155;
            border-radius: 4px;
            background: #0f172a;
            cursor: pointer;
            font-size: 0.7rem;
            font-family: inherit;
            color: #94a3b8;
            transition: all 0.15s;
        }

        .topbar-grid [data-layout]:hover {
            background: #334155;
            color: #e2e8f0;
        }

        .topbar-grid [data-layout].active {
            background: #22d3ee;
            color: #0f172a;
            border-color: #22d3ee;
        }

        .topbar-grid .layout-row {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .topbar-grid .results-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .topbar-grid .atlas-result-counter {
            font-size: 0.75rem;
            color: #94a3b8;
            padding: 0;
        }

        /* ─── Directory Area ──────────────────────────── */

        .directory-area {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem 2rem 1.5rem;
        }

        /* ─── Members ────────────────────────────────── */

        [data-member] {
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: white;
            transition: box-shadow 0.2s;
        }

        [data-member]:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        [data-field] {
            display: block;
        }

        [data-field="name"] {
            font-weight: 600;
            font-size: 1.05rem;
        }

        [data-field="faceclaim"] {
            font-size: 0.85rem;
            color: #64748b;
        }

        [data-field="species"],
        [data-field="occupation"],
        [data-field="faction"],
        [data-field="homeworld"],
        [data-field="status"] {
            font-size: 0.85rem;
            color: #475569;
        }

        [data-directory].atlas-layout-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
            padding: 0.5rem 0;
        }

        [data-directory].atlas-layout-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 0.5rem 0;
        }

        [data-directory].atlas-layout-list [data-member] {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.5rem 1rem;
        }

        [data-directory].atlas-layout-list [data-field] {
            display: inline;
        }

        [data-directory].atlas-layout-list [data-field="name"] {
            min-width: 150px;
            font-weight: 600;
        }

        [data-directory].atlas-layout-list [data-field="faceclaim"] {
            min-width: 100px;
            color: #64748b;
        }

        [data-member][hidden],
        [data-member][data-hidden] {
            display: none !important;
        }

        /* ─── Code Display ────────────────────────────── */

        .code-section {
            max-width: 1200px;
            margin: 2rem auto 0 auto;
            background: #1e293b;
            border-radius: 12px;
            padding: 1.5rem 2rem;
            color: #e2e8f0;
        }

        .code-section h2 {
            color: #e2e8f0;
            font-size: 1.1rem;
            margin: 0 0 0.5rem 0;
        }

        .code-section .code-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .code-section .code-box {
            background: #0f172a;
            border-radius: 8px;
            padding: 1rem;
            overflow: auto;
            max-height: 400px;
        }

        .code-section .code-box h3 {
            color: #94a3b8;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 0 0 0.5rem 0;
        }

        .code-section .code-box pre {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.75rem;
            color: #e2e8f0;
            white-space: pre-wrap;
            word-break: break-word;
            margin: 0;
        }

        /* ─── Responsive ───────────────────────────────── */

        @media (max-width: 820px) {
            .topbar-grid {
                grid-template-columns: 1fr 1fr;
            }

            .topbar-grid > *:last-child {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 640px) {
            .topbar-grid {
                grid-template-columns: 1fr;
            }

            .topbar-grid > *:last-child {
                grid-column: auto;
            }

            .page-header {
                padding: 1rem;
            }

            .directory-area {
                padding: 0 1rem 2rem 1rem;
            }

            [data-directory].atlas-layout-list [data-member] {
                flex-wrap: wrap;
            }

            [data-directory].atlas-layout-list [data-field="name"] {
                min-width: auto;
                width: 100%;
            }

            .code-section .code-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- ─── Fixed Top Bar ─────────────────────────────── -->

    <div class="topbar-wrapper" id="topbarWrapper">
        <div class="topbar-inner-wrapper">

            <button class="topbar-toggle" id="topbarToggle" aria-expanded="false">
                <span>☰ Atlas Controls</span>
                <span class="badge">Click to expand</span>
                <span class="arrow" id="arrowIcon">▼</span>
            </button>

            <div class="topbar-content" id="topbarContent">
                <div class="topbar-grid" data-atlas-controls>

                    <!-- Column 1: Filters -->
                    <div>
                        <div data-filters></div>
                    </div>

                    <!-- Column 2: Sort + Search + Layout -->
                    <div>
                        <div data-sort></div>
                        <div style="margin-top: 0.5rem;">
                            <input data-search placeholder="Search members...">
                        </div>
                        <div style="margin-top: 0.5rem;" class="layout-row">
                            <button data-layout="grid">Grid</button>
                            <button data-layout="list">List</button>
                        </div>
                    </div>

                    <!-- Column 3: Chips + Results -->
                    <div>
                        <div data-chips></div>
                        <div class="results-row">
                            <div data-results></div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <!-- ─── Page Header ───────────────────────────────── -->

    <div class="page-header">
        <h1>Slide-out Top Bar (Fixed)</h1>
        <p>Controls are fixed to the top of the page and follow as you scroll.</p>
        <div class="nav-links">
            <a href="index.html">← All Examples</a>
            <a href="../index.html">Main Demo</a>
        </div>
    </div>

    <!-- ─── Directory Area ─────────────────────────────── -->

    <div data-atlas>
        <div class="directory-area">
            <div data-directory id="directory"></div>
        </div>
    </div>

    <!-- ─── Code Display ───────────────────────────────── -->

    <div class="code-section">
        <h2>📄 Code Used in This Example</h2>
        <div class="code-grid">
            <div class="code-box">
                <h3>HTML</h3>
                <pre id="html-code"></pre>
            </div>
            <div class="code-box">
                <h3>CSS</h3>
                <pre id="css-code"></pre>
            </div>
        </div>
    </div>

    <script type="module">
        import { initExample, displayCode } from './assets/js/examples.js';

        // ─── Slide-out Toggle ──────────────────────────

        const toggle = document.getElementById('topbarToggle');
        const content = document.getElementById('topbarContent');
        const arrow = document.getElementById('arrowIcon');

        if (toggle && content) {
            toggle.addEventListener('click', () => {
                const isOpen = content.classList.toggle('open');
                toggle.setAttribute('aria-expanded', isOpen);
                if (arrow) {
                    arrow.classList.toggle('open', isOpen);
                }
            });
        }

        // ─── Initialise Atlas ──────────────────────────

        initExample('directory');

        // Display the code used
        displayCode('#html-code', '#css-code');
    </script>

</body>
</html>
