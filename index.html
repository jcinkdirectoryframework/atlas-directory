<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Atlas Demo</title>

</head>

<body>

<div data-atlas>

    <input
        data-search
        placeholder="Search">

    <button
        data-layout="grid">
        Grid
    </button>

    <button
        data-layout="list">
        List
    </button>

    <div
        data-filter
        data-field="species">
    </div>

    <div
        data-filter
        data-field="occupation">
    </div>

    <section data-directory>

        <article data-member>

            Alice

        </article>

        <article data-member>

            Bob

        </article>

        <article data-member>

            Charlie

        </article>

    </section>

</div>

<script type="module">

console.log("Module loaded");

import Atlas from "./src/index.js";

console.log("Atlas imported");

new Atlas({

    debug: true

});

console.log("Atlas created");

</script>

</body>
</html>
