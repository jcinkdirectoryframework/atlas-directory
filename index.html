<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Atlas Demo</title>

</head>

<body>

<div data-atlas>

    <input
        data-search
        placeholder="Search members...">

    <button
        data-layout="grid">
        Grid
    </button>

    <button
        data-layout="list">
        List
    </button>

    <div
        data-filter
        data-field="species">
        <label>Species</label>
        <select>
            <option value="">All</option>
            <option value="elf">Elf</option>
            <option value="dwarf">Dwarf</option>
            <option value="human">Human</option>
        </select>
    </div>

    <div
        data-filter
        data-field="occupation">
        <label>Occupation</label>
        <select>
            <option value="">All</option>
            <option value="ranger">Ranger</option>
            <option value="warrior">Warrior</option>
            <option value="mage">Mage</option>
            <option value="rogue">Rogue</option>
        </select>
    </div>

    <section data-directory>

        <article data-member>
            <h3 data-field="name">Alice</h3>
            <p data-field="species">Elf</p>
            <p data-field="occupation">Ranger</p>
        </article>

        <article data-member>
            <h3 data-field="name">Bob</h3>
            <p data-field="species">Dwarf</p>
            <p data-field="occupation">Warrior</p>
        </article>

        <article data-member>
            <h3 data-field="name">Charlie</h3>
            <p data-field="species">Human</p>
            <p data-field="occupation">Mage</p>
        </article>

        <article data-member>
            <h3 data-field="name">Diana</h3>
            <p data-field="species">Elf</p>
            <p data-field="occupation">Rogue</p>
        </article>

        <article data-member>
            <h3 data-field="name">Eve</h3>
            <p data-field="species">Human</p>
            <p data-field="occupation">Warrior</p>
        </article>

    </section>

</div>

<script type="module">
(async () => {
    console.log("Starting Atlas...");

    const { default: Atlas } = await import("./src/index.js");

    console.log("Atlas loaded");

    new Atlas({
        debug: true
    });

    console.log("Atlas created");
})();
</script>

</body>
</html>
