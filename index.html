<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Atlas Demo</title>

    <link rel="stylesheet" href="./demo.css.css">

</head>

<body>

<div data-atlas>

    <input data-search placeholder="Search members...">

    <div>
        <button data-layout="grid">
            Grid
        </button>

        <button data-layout="list">
            List
        </button>
    </div>

    <!-- Atlas will generate filters here -->
    <div data-filters></div>

    <!-- Atlas will display active filter chips here -->
    <div data-chips></div>

    <!-- Atlas will display the result counter here -->
    <div data-results></div>

    <section data-directory>

        <article data-member>
            <h3 data-field="name" data-filterable="false">Alice</h3>
            <p data-field="species">Elf</p>
            <p data-field="occupation">Ranger</p>
        </article>

        <article data-member>
            <h3 data-field="name" data-filterable="false">Bob</h3>
            <p data-field="species">Dwarf</p>
            <p data-field="occupation">Warrior</p>
        </article>

        <article data-member>
            <h3 data-field="name" data-filterable="false">Charlie</h3>
            <p data-field="species">Human</p>
            <p data-field="occupation">Mage</p>
        </article>

        <article data-member>
            <h3 data-field="name" data-filterable="false">Diana</h3>
            <p data-field="species">Elf</p>
            <p data-field="occupation">Rogue</p>
        </article>

        <article data-member>
            <h3 data-field="name" data-filterable="false">Eve</h3>
            <p data-field="species">Human</p>
            <p data-field="occupation">Warrior</p>
        </article>

    </section>

</div>

<script type="module">
(async () => {
    console.log("Starting Atlas...");

    const { default: Atlas } = await import("./src/index.js");

    console.log("Atlas loaded");

    new Atlas({
        debug: true
    });

    console.log("Atlas created");
})();
</script>

</body>
</html>
