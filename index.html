<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Atlas Demo</title>

    <link rel="stylesheet" href="demo.css">

</head>

<body>

<div data-atlas>

    <input data-search placeholder="Search members...">

    <div>
        <button data-layout="grid">
            Grid
        </button>

        <button data-layout="list">
            List
        </button>
    </div>

    <!-- Sort controls generated here -->
    <div data-sort></div>

    <!-- Filter controls generated here -->
    <div data-filters></div>

    <!-- Active filter chips here -->
    <div data-chips></div>

    <!-- Result counter here -->
    <div data-results></div>

<section data-directory>

        <article data-member>
            <h3 data-field="name" data-searchable="true" data-sortable="true" data-filterable="false">Alice</h3>
            <p data-field="species" data-searchable="true">Elf</p>
            <p data-field="occupation" data-sortable="true">Ranger</p>
        </article>

        <article data-member>
            <h3 data-field="name" data-searchable="true" data-sortable="true" data-filterable="false">Bob</h3>
            <p data-field="species" data-searchable="true">Dwarf</p>
            <p data-field="occupation" data-sortable="true">Warrior</p>
        </article>

        <article data-member>
            <h3 data-field="name" data-searchable="true" data-sortable="true" data-filterable="false">Charlie</h3>
            <p data-field="species" data-searchable="true">Human</p>
            <p data-field="occupation" data-sortable="true">Mage</p>
        </article>

        <article data-member>
            <h3 data-field="name" data-searchable="true" data-sortable="true" data-filterable="false">Diana</h3>
            <p data-field="species" data-searchable="true">Elf</p>
            <p data-field="occupation" data-sortable="true">Rogue</p>
        </article>

        <article data-member>
            <h3 data-field="name" data-searchable="true" data-sortable="true" data-filterable="false">Eve</h3>
            <p data-field="species" data-searchable="true">Human</p>
            <p data-field="occupation" data-sortable="true">Warrior</p>
        </article>

    </section>

</div>

<script type="module">
(async () => {
    console.log("Starting Atlas...");

    const { default: Atlas } = await import("./src/index.js");

    console.log("Atlas loaded");

    new Atlas({
        debug: true
    });

    console.log("Atlas created");
})();
</script>

</body>
</html>
